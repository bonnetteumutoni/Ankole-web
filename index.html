</head>

<body>
    <div class="logo-homepage"><img src="Images/horn.svg"></div>
    <div class="animate-images">
        <div class="image-text">
            <img src="Images/first-image.jpg" id="first-image" />

        </div>
        <div class="image-text">

        </div>
        <div class="image-text">
            <img src="Images/fifth.jpg" id="fifth-image" />
            <div class="text-caption"><b>Savour</b></div>
        </div>
        <script>
            var myIndex = 0;
            coursel();
            function coursel() {
                var i;
                var x = document.getElementsByClassName("image-text");
                for (i = 0; i < x.length; i++) {
                    x[i].style.display = "none"
                }
                myIndex++;
                if (myIndex > x.length) { myIndex = 1 }
                x[myIndex - 1].style.display = "block";
                setTimeout(coursel, 5000);
            }
        </script>
